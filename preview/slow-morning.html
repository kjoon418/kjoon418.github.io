<p>첫 커피를 마시는 동안 작은 종이에 세 줄을 적어 본다. 머릿속에 남아 있는 일 하나, 오늘 붙잡고 싶은 일 하나, 저녁에 확인할 수 있는 결과 하나다.</p>
<h2>끝난 상태를 적는다</h2>
<p>‘책 읽기’보다 ‘한 장을 읽고 기억하고 싶은 문장 하나 옮기기’가 좋다. 저녁에 종이를 다시 보았을 때 끝났는지 한눈에 알 수 있기 때문이다.</p>
<p>하루가 바뀌면 두 번째 줄을 고쳐도 된다. 적어 둔 문장은 오늘의 방향을 다시 정하는 데 쓸 수 있다.</p>
