<p>회고를 시작할 때는 캘린더, 작업 목록, 메모를 열어 지난주에 있었던 일을 다섯 줄로 적는다. 어떤 일이 길어졌는지와 어디에서 도움을 받았는지도 같이 남긴다.</p>
<h2>다음 주에 확인할 행동을 고른다</h2>
<ul>
  <li>반복해서 시간을 쓴 일을 하나 고른다.</li>
  <li>다음에 비슷한 일이 생겼을 때 바꿀 행동을 적는다.</li>
  <li>한 주 뒤에 확인할 기준을 정한다.</li>
</ul>
<p>‘회의를 줄인다’는 기록을 ‘회의 전 질문 세 개를 공유하고, 회의에서 결정을 하나 내렸는지 본다’로 바꿔 쓰면 다음 회고에서 효과를 확인할 수 있다.</p>
