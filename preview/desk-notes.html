<p>막힌 문장을 고치다가 노트 한 권을 들고 창가로 옮겼다. 화면 밖에서 문단을 떠올려 보니, 설명에 필요한 예시를 빠뜨린 채 접속사만 고치고 있었다.</p>
<h2>막힌 위치를 질문으로 남긴다</h2>
<p>일어나기 전에 ‘독자는 이 문장에서 무엇을 이미 알고 있다고 가정하는가?’라고 적었다. 돌아온 뒤 그 질문 아래에 예시 한 줄을 쓰니 어디부터 고쳐야 할지 보였다.</p>
<p>이후에는 답을 얻을 때까지 앉아 있기보다, 돌아왔을 때 다시 시작할 질문을 한 줄 남겨 둔다.</p>
